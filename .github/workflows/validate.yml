name: Validate research knowledge base

on:
  push:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "crystal/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "crystal/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate paper index and reports
        run: python scripts/validate_repo.py
